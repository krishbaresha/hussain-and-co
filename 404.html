<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #04335d, #2ecc71);
            color: white;
            text-align: center;
        }
        .container {
            max-width: 700px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            margin: 0;
            color: #2ecc71;
        }
        .error-message {
            font-size: 1.8rem;
            margin: 1rem 0;
            font-weight: 500;
        }
        .description {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            color: #f0f0f0;
        }
        .home-button {
            display: inline-block;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            color: #04335d;
            background-color: #ffffff;
            border: none;
            border-radius: 25px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .home-button:hover {
            background-color: #f2f2f2;
            transform: scale(1.05);
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            color: #ffffff;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <i class="bx bx-error icon"></i>
        <div class="error-code">404</div>
        <div class="error-message">Oops! Page Not Found</div>
        <div class="description">It seems the page you are looking for does not exist or has been moved. Please check the URL or return to the homepage.</div>
        <a href="index.html" class="home-button">Return Home</a>
    </div>
</body>
</html>
