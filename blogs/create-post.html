function validateSession() {
    // Step 1: Retrieve session details
    fetch('check_session.php', {
        method: 'GET',
        credentials: 'same-origin', // Include cookies with the request
    })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'error') {
                // If no valid session is found, redirect to login
                console.error(data.message);
                window.location.href = 'login.html';
            } else if (data.status === 'success') {
               

                // Step 2: Validate the session using session_id and unique_id
                fetch('check-session.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: data.session_id,
                        unique_id: data.unique_id,
                    }),
                    credentials: 'same-origin', // Include cookies with the request
                })
                    .then(response => response.json())
                    .then(sessionData => {
                        if (sessionData.status === 'error') {
                            // If session is invalid, redirect to login
                            console.error(sessionData.message);
                            window.location.href = 'login.html';
                        } else if (sessionData.status === 'success') {
                        
                            // Allow access to the current page
                        }
                    })
                    .catch(error => {
                        console.error('Error validating session:', error);
                        window.location.href = 'login.html'; // Redirect if an error occurs
                    });
            }
        })
        .catch(error => {
            console.error('Error retrieving session details:', error);
            window.location.href = 'login.html'; // Redirect if an error occurs
        });
}

// Call validateSession when the page loads
document.addEventListener('DOMContentLoaded', validateSession);
    
    // Function to log out the user by calling the PHP logout script
    function logout() {
        // Send a GET request to the logout.php script to destroy the session
        fetch('logout.php', {
            method: 'GET',
            credentials: 'same-origin'  // Include cookies with the request
        })
        .then(response => response.json())  // Parse the JSON response
        .then(data => {
            if (data.status === 'success') {
                // Redirect to the login page after successful logout
                window.location.href = 'login.html';  // Change the URL to the login page
            } else {
                // Optionally, show an error message if logout fails
                console.log('Error logging out:', data.message);
            }
        })
        .catch(error => {
            console.error('Error during logout:', error);
        });
    }
    

    
    // Attach the logout function to the logout button
    document.getElementById('logoutButton').addEventListener('click', function(e) {
        e.preventDefault();  // Prevent the default anchor behavior
        logout();  // Call the logout function
    });
    </script>
    


<script>
    document.addEventListener('DOMContentLoaded', function() {
        $('#blogForm').on('submit', function(event){
            event.preventDefault();  // Prevent the default form submission (no page reload)

            // Get the content from TinyMCE editor
            var postContent = tinymce.get('postContent').getContent(); // Get the HTML content from TinyMCE

            // Optionally, parse the HTML content and clean it up
            var parser = new DOMParser();
            var doc = parser.parseFromString(postContent, 'text/html');

            // Remove unwanted tags like script, iframe, and style
            ['script', 'iframe', 'style'].forEach(function(tag) {
                var elements = doc.querySelectorAll(tag);
                elements.forEach(function(el) {
                    el.parentNode.removeChild(el);
                });
            });

            // Remove inline styles from elements (if necessary)
            var elementsWithStyle = doc.querySelectorAll('[style]');
            elementsWithStyle.forEach(function(element) {
                // Optionally, remove specific styles like background-color
                element.removeAttribute('style');  // Remove all inline styles
            });

            // If you want to keep certain styles, you can apply conditions here
            // For example, you can keep font styles but remove background-color
            doc.querySelectorAll('p, strong, ul').forEach(function(el) {
                el.style.removeProperty('background-color');  // Remove background color
            });

            // Get the sanitized HTML content
            var sanitizedContent = doc.body.innerHTML;

            // Log the sanitized content to the console for diagnosis

            // Collect the form data
            var formData = new FormData(this);  // Collect the form data
            formData.append('postContent', sanitizedContent); // Append the sanitized TinyMCE content to the form data

            // Append the file inputs
            var fullImage = document.getElementById('fullImage').files[0];
            var thumbnailImage = document.getElementById('postThumbnail').files[0];

            formData.append('fullImage', fullImage);
            formData.append('thumbnailImage', thumbnailImage);

            // Make an AJAX request to submit the form data
            $.ajax({
                url: 'submit-blog-post.php',  // Your PHP file that handles the form submission
                method: 'POST',
                data: formData,
                contentType: false,  // This tells jQuery not to set the content-type header
                processData: false,  // This prevents jQuery from trying to process the data
                success: function(response){
                    try {
                        var res = JSON.parse(response);  // Parse the JSON response

                        if (res.status === 'success') {
                            // On success, show success alert and modal
                            $('#successAlert').show();  // Show the success alert
                            $('#successModal').modal('show');  // Show the success modal
                            $('#blogForm')[0].reset();  // Reset the form
                        } else {
                            // On error, show error modal with the message from response
                            $('#errorMessage').text(res.message);  // Set error message
                            $('#errorModal').modal('show');  // Show the error modal
                        }
                    } catch (e) {
                        // Handle case where JSON parsing fails
                        $('#errorMessage').text('We apologize for the inconvenience. Please try again later.');
                        $('#errorModal').modal('show');  // Show the error modal
                    }
                },
                error: function(jqXHR, textStatus, errorThrown) {
                    // Handle AJAX error (e.g., network issues)
                    if (jqXHR.status === 0) {
                        // Network error
                        $('#errorMessage').text('Network error: Unable to reach the server. Please check your internet connection.');
                    } else if (jqXHR.status == 404) {
                        // Server not found
                        $('#errorMessage').text('Server not found (404). Please try again later.');
                    } else if (jqXHR.status == 405) {
                        // Server not found
                        $('#errorMessage').text('An error occurred while submitting (405). Please try again later.');
                    } else if (jqXHR.status == 500) {
                        // Internal server error
                        $('#errorMessage').text('Internal server error (500). Please try again later.');
                    } else if (textStatus === 'timeout') {
                        // Timeout error
                        $('#errorMessage').text('Request timed out. Please try again later.');
                    } else {
                        // Generic error message for other cases
                        $('#errorMessage').text('An error occurred while submitting the form. Please try again later.');
                    }
                    $('#errorModal').modal('show');  // Show the error modal
                }
            });
        });

        // Close the success modal when the user clicks the "Close" button
        $('#closeModalBtn').on('click', function() {
            $('#successModal').modal('hide');  // Close the success modal
        });

        // Close the error modal when the user clicks the "Close" button
        $('#closeErrorModal').on('click', function() {
            $('#errorModal').modal('hide');  // Close the error modal
        });
    });
</script>
