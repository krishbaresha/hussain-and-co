<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hussain & Co.</title>
     <!-- Preload Bootstrap and Font Awesome CSS for faster loading -->
    <link rel="preload" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    
    <!-- Fallback for browsers that don't support preload -->
    <noscript>
        <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    </noscript>
    <link rel="icon" href="../images/user.png" type="image/x-icon">

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .flash_alert {
            width: 100%;
            padding: 10px;
            text-align: center;
            background-color: #dc4747;
            color: #fff;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            display: none;
        }
        .login-card {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-card h3 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .eye-icon {
            position: absolute;
            top: 70%;
            right: 15px;
            transform: translateY(-50%);
            cursor: pointer;
        }
        .remember-me {
            display: flex;
            align-items: center;
        }
        .remember-me input {
            margin-right: 10px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    
    <!-- Flash Alert (Initially Hidden) -->
    <div id="flashMessage" class="flash_alert"></div>
    
    <div class="login-card">
        <h3>Login to Dashboard</h3>
 

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="form-group position-relative">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
                <i class="fas fa-eye eye-icon" id="eye-icon" onclick="togglePassword()"></i>
            </div>
            <div class="form-group remember-me">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <label for="rememberMe">Remember Me</label>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

       
    </div>

    <!-- Include necessary JS files -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>




    <script>
        // Toggle password visibility
        function togglePassword() {
            var passwordField = document.getElementById('password');
            var eyeIcon = document.getElementById('eye-icon');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    
        // Fetch IP address using ipify API
        function fetchIpAddress() {
            return fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    return data.ip; // Return IP address
                })
                .catch(error => {
                    console.error('Error fetching IP address:', error);
                    return null; // Return null if there's an error
                });
        }
    
        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();  // Prevent the default form submission
    
            // Get form data
            var formData = new FormData(this);
            
            // Fetch the user's IP address
            fetchIpAddress().then(ipAddress => {
                if (ipAddress) {
                    // Append IP address to form data
                    formData.append('ip_address', ipAddress);
                    
                    // Send form data (including IP address) to login.php using AJAX
                    fetch('login.php', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'error') {
                            // Show the flash message with the error message
                            document.getElementById('flashMessage').innerText = data.message;
                            document.getElementById('flashMessage').style.display = 'block';
                        } else {
                            // If login is successful, redirect to the dashboard
                            window.location.href = 'dashboard.html'; // Replace with your dashboard URL
                        }
                    })
                    .catch(error => {
                        document.getElementById('flashMessage').innerText = 'An unexpected error occurred. Please try again.';
                        document.getElementById('flashMessage').style.display = 'block';
                    });
                }
            });
        });
    </script>
    


<script>
// Function to check and validate session on login page
function checkSessionOnLogin() {
    // Step 1: Retrieve the session details from check_session.php
    fetch('check_session.php', {
        method: 'GET',
        credentials: 'same-origin', // Include cookies with the request
    })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success' && data.unique_id) {
                // If session exists and unique_id is found, send details to check-session.php for validation
                console.log('Session found for Unique ID');
                
                fetch('check-session.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        unique_id: data.unique_id,
                        session_id: data.session_id,
                    })
                })
                    .then(response => response.json())
                    .then(sessionData => {
                        if (sessionData.status === 'success') {
                            // If session is valid, redirect to dashboard
                            console.log('Session is valid. Redirecting to dashboard.');
                            window.location.href = 'dashboard.html';
                        } else {
                            // If session is invalid, do nothing and let the user log in
                            console.log('Session expired or invalid. Please log in.');
                        }
                    })
                    .catch(error => {
                        console.error('Error validating session in check-session.php:', error);
                    });
            } else {
                // If no valid session exists, let the user log in
                console.log('No valid session found, proceed to login.');
            }
        })
        .catch(error => {
            console.error('Error checking session in check_session.php:', error);
            // If an error occurs, allow the user to log in
        });
}

// Call checkSessionOnLogin when the page loads
document.addEventListener('DOMContentLoaded', checkSessionOnLogin);


</script>

</body>

</html>
