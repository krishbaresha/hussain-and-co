<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Hussain & Co.</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="icon" href="../images/bar-chart.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Custom Theme Colors */
        :root {
            --primary-color: #04335d; /* Dark Blue */
            --secondary-color: #95a5a6; /* Light Gray */
            --accent-color: #2ecc71; /* Green */
            --neutral-color: #ffffff; /* White */
        }

        /* Body */
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f8f9fa;
        }

        /* Sidebar */
        .sidebar {
            background-color: var(--primary-color);
            color: white;
            position: fixed;
            height: 100vh;
            width: 250px;
            padding-top: 50px;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .sidebar .nav-link {
            color: white;
        }

        .sidebar .nav-link:hover {
            background-color: var(--accent-color);
            color: white;
        }

        /* Main Content */
        .main-content {
            margin-left: 250px;
            padding: 20px;
            transition: margin-left 0.3s ease;
        }

        .main-content h1 {
            color: var(--primary-color);
            margin-bottom: 30px;
            margin-top: 20px;
        }

        /* Cards */
        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            background-color: var(--primary-color);
            color: white;
        }

        /* Sidebar Toggle Button */
        .sidebar-toggle {
            font-size: 1.5rem;
            color: var(--primary-color); /* Initial color is primary */
            cursor: pointer;
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
        }

        .sidebar-toggle.active {
            color: white; /* Color when sidebar is active */
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            /* Hide sidebar initially */
            .sidebar {
                left: -250px;
                width: 0;
                transition: left 0.3s ease;
            }

            .sidebar.active {
                left: 0;
                width: 250px;
            }

            /* Adjust main content margin when sidebar is active */
            .main-content.active {
                margin-left: 0;
            }

            .main-content {
                margin-left: 0;
            }

            .main-content h1 {
                margin-top: 0;
                margin-left: 23px;
            }

            /* Prevent row from overlapping sidebar on mobile */
            .row {
                margin-left: 0;
                padding-left: 0;
            }

            /* Adjust cards to be full-width on mobile */
            .card {
                margin-bottom: 15px;
            }

            /* Sidebar Toggle Button Visibility */
            .sidebar-toggle {
                display: block;
                position: fixed;
                top: 15px;
                left: 15px;
                z-index: 1000;
            }
        }

        /* Hide Sidebar Toggle Button for desktop */
        @media (min-width: 769px) {
            .sidebar-toggle {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2 class="text-center pt-5">Hussain & Co.</h2>
        <ul class="nav flex-column ml-3 mt-5">
            <li class="nav-item">
                <a class="nav-link active" href="#"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="create-post.html"><i class="fas fa-plus-circle"></i> Create Post</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="manage-posts.html"><i class="fas fa-edit"></i> Manage Posts</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="comments.html"><i class="fas fa-comments"></i> Manage Comments</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="profile-settings.html"><i class="fas fa-user-cog"></i> Profile Settings</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" id="logoutButton"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h1>Welcome to Your Dashboard</h1>

        <!-- Stats Section -->
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Visit Stats (Last 7 Days)</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="visitStatsChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Post Comments (Last 7 Days)</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="commentsStatsChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Post Count and Memory Usage -->
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Post Count</h5>
                    </div>
                    <div class="card-body">
                        <p>Current Post Count: 120</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Memory Usage</h5>
                    </div>
                    <div class="card-body">
                        <p>Memory Usage: 75%</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar Toggle Button -->
    <div class="sidebar-toggle d-md-none">
        <i class="fas fa-bars"></i>
    </div>

    <!-- Bootstrap JS and Dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        // Toggle Sidebar
        document.querySelector('.sidebar-toggle').addEventListener('click', function() {
            var sidebar = document.querySelector('.sidebar');
            var mainContent = document.querySelector('.main-content');
            var toggleButton = document.querySelector('.sidebar-toggle');

            // Toggle the active class for sidebar and main content
            sidebar.classList.toggle('active');
            mainContent.classList.toggle('active');
            
            // Toggle the active class for the toggle button to change color
            toggleButton.classList.toggle('active');
        });

        // Data for the charts
        var visitData = {
            labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
            datasets: [{
                label: 'Visits',
                data: [100, 150, 120, 180, 220, 250, 300],
                backgroundColor: 'rgba(0, 123, 255, 0.5)',
                borderColor: 'rgba(0, 123, 255, 1)',
                borderWidth: 1
            }]
        };

        var commentsData = {
            labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
            datasets: [{
                label: 'Comments',
                data: [20, 40, 30, 50, 70, 60, 90],
                backgroundColor: 'rgba(40, 167, 69, 0.5)',
                borderColor: 'rgba(40, 167, 69, 1)',
                borderWidth: 1
            }]
        };

        // Create the charts
        var visitStatsChart = new Chart(document.getElementById('visitStatsChart'), {
            type: 'bar',
            data: visitData,
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        var commentsStatsChart = new Chart(document.getElementById('commentsStatsChart'), {
            type: 'line',
            data: commentsData,
            options: {
                responsive: true
            }
        });
    </script>



<script>


function validateSession() {
    // Step 1: Retrieve session details
    fetch('check_session.php', {
        method: 'GET',
        credentials: 'same-origin', // Include cookies with the request
    })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'error') {
                // If no valid session is found, redirect to login
                console.error(data.message);
                window.location.href = 'login.html';
            } else if (data.status === 'success') {
               

                // Step 2: Validate the session using session_id and unique_id
                fetch('check-session.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: data.session_id,
                        unique_id: data.unique_id,
                    }),
                    credentials: 'same-origin', // Include cookies with the request
                })
                    .then(response => response.json())
                    .then(sessionData => {
                        if (sessionData.status === 'error') {
                            // If session is invalid, redirect to login
                            console.error(sessionData.message);
                            window.location.href = 'login.html';
                        } else if (sessionData.status === 'success') {
                            
                            // Allow access to the current page
                        }
                    })
                    .catch(error => {
                        console.error('Error validating session:', error);
                        window.location.href = 'login.html'; // Redirect if an error occurs
                    });
            }
        })
        .catch(error => {
            console.error('Error retrieving session details:', error);
            window.location.href = 'login.html'; // Redirect if an error occurs
        });
}

// Call validateSession when the page loads
document.addEventListener('DOMContentLoaded', validateSession);

    
    
    // Function to log out the user by calling the PHP logout script
    function logout() {
        // Send a GET request to the logout.php script to destroy the session
        fetch('logout.php', {
            method: 'GET',
            credentials: 'same-origin'  // Include cookies with the request
        })
        .then(response => response.json())  // Parse the JSON response
        .then(data => {
            if (data.status === 'success') {
                // Redirect to the login page after successful logout
                window.location.href = 'login.html';  // Change the URL to the login page
            } else {
                // Optionally, show an error message if logout fails
                console.log('Error logging out:', data.message);
            }
        })
        .catch(error => {
            console.error('Error during logout:', error);
        });
    }
    
    // Call checkSession when the page loads
    document.addEventListener('DOMContentLoaded', validateSession);
    
    // Attach the logout function to the logout button
    document.getElementById('logoutButton').addEventListener('click', function(e) {
        e.preventDefault();  // Prevent the default anchor behavior
        logout();  // Call the logout function
    });
    </script>
    
</body>
</html>
