<!-- Script -->
<script>
    let currentDeleteCommentId = null;

    // Fetch all comments and display them
    function loadComments() {
        fetch('comments.php')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    displayComments(data.comments);
                    updateCommentsCount(); // Update comment count after displaying comments
                } else {
                    showAlert('Failed to load comments', 'danger');
                }
            })
            .catch(error => {
                console.error('Error fetching comments:', error);
                showAlert('An error occurred while fetching comments', 'danger');
            });
    }

    // Display comments on the page
    function displayComments(comments) {
        const commentsList = document.getElementById('commentsList');
        commentsList.innerHTML = ''; // Clear any existing comments

        if (comments.length === 0) {
            commentsList.innerHTML = '<p>No comments yet.</p>';
        }

        comments.forEach(comment => {
            const commentDiv = document.createElement('div');
            commentDiv.classList.add('comment-item', 'mb-3', 'p-3', 'border');
            commentDiv.id = 'comment-' + comment.id;

            commentDiv.innerHTML = `
                <div class="comment-author font-weight-bold">${comment.name}</div>
                <div class="comment-text">${comment.message}</div>
                <div class="comment-actions mt-2">
                    <button class="btn btn-primary btn-sm me-2" onclick="editComment(${comment.id})">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteComment(${comment.id})">Delete</button>
                </div>
            `;

            commentsList.appendChild(commentDiv);
        });
    }

    // Edit comment
    function editComment(commentId) {
        fetch('comments.php')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    const comment = data.comments.find(c => c.id === String(commentId));
                    if (comment) {
                        document.getElementById('editCommentText').value = comment.message;
                        $('#editCommentModal').modal('show');
                        currentEditCommentId = commentId;
                    } else {
                        showAlert('Comment not found.', 'warning');
                    }
                } else {
                    showAlert('Failed to load comments.', 'danger');
                }
            })
            .catch(error => {
                console.error('Error fetching comment for edit:', error);
                showAlert('An error occurred while fetching the comment.', 'danger');
            });
    }

    document.querySelector('.btn-secondary').addEventListener('click', function() {
        console.log('Cancel edit');
        $('#editCommentModal').modal('hide');
    });

//     // Handle the Cancel button for edit comment modal
// document.querySelector('.btn-secondary').addEventListener('click', function() {
//     console.log('Cancel edit');
//     const modal = document.getElementById('editCommentModal');
//     modal.classList.remove('show'); // Remove the 'show' class to hide the modal
//     // Hide the modal by setting its display property to 'none'
// });


    // Save edited comment
    document.getElementById('saveCommentBtn').addEventListener('click', function () {
        const updatedText = document.getElementById('editCommentText').value;

        fetch('comments.php', {
            method: 'PUT',
            body: JSON.stringify({ id: currentEditCommentId, message: updatedText }),
            headers: { 'Content-Type': 'application/json' },
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                const commentElement = document.getElementById('comment-' + currentEditCommentId);
                const commentText = commentElement.querySelector('.comment-text');
                commentText.innerText = updatedText;

                $('#editCommentModal').modal('hide');
                showAlert('Comment updated successfully.', 'success');
            } else {
                showAlert('Failed to update comment.', 'danger');
            }
        })
        .catch(error => {
            console.error('Error saving comment:', error);
            showAlert('An error occurred while saving the comment.', 'danger');
        });
    });

    // Show confirmation modal to delete comment
    function deleteComment(commentId) {
        currentDeleteCommentId = commentId;
        $('#deleteConfirmModal').modal('show');
    }

    // Handle the deletion of the comment when confirmed
    document.getElementById('confirmDeleteBtn').addEventListener('click', function () {
        fetch('comments.php', {
            method: 'DELETE',
            body: JSON.stringify({ id: currentDeleteCommentId }),
            headers: { 'Content-Type': 'application/json' },
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                const commentElement = document.getElementById('comment-' + currentDeleteCommentId);
                if (commentElement) {
                    commentElement.remove();
                }
                updateCommentsCount(); // Update comment count after deletion
                showAlert('Comment deleted successfully.', 'success');
            } else {
                showAlert(data.message || 'Failed to delete comment.', 'danger');
            }
            $('#deleteConfirmModal').modal('hide');
        })
        .catch(error => {
            console.error('Error deleting comment:', error);
            showAlert('An error occurred while deleting the comment.', 'danger');
            $('#deleteConfirmModal').modal('hide');
        });
    });

    // Handle the Cancel button for delete confirmation
    document.querySelector('.btn-secondary').addEventListener('click', function() {
        console.log('Cancel deletion');
        $('#deleteConfirmModal').modal('hide');
    });

    // Update the comment count
    function updateCommentsCount() {
        const commentItems = document.querySelectorAll('.comment-item');
        const commentCount = commentItems.length; // Count the number of .comment-item elements
        document.getElementById('commentsCount').innerText = commentCount;
    }

    // Show Bootstrap alert messages (success or error)
    function showAlert(message, type) {
        const alertContainer = document.getElementById('alertContainer');
        const alertDiv = document.createElement('div');
        alertDiv.classList.add('alert', 'alert-' + type, 'alert-dismissible', 'fade', 'show');
        alertDiv.role = 'alert';
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        `;
        alertContainer.appendChild(alertDiv);

        // Automatically remove the alert after 5 seconds
        setTimeout(() => {
            alertDiv.classList.remove('show');
        }, 5000);
    }

    // Load comments on page load
    document.addEventListener('DOMContentLoaded', loadComments);
</script>





<script>
   
function validateSession() {
    // Step 1: Retrieve session details
    fetch('check_session.php', {
        method: 'GET',
        credentials: 'same-origin', // Include cookies with the request
    })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'error') {
                // If no valid session is found, redirect to login
                console.error(data.message);
                window.location.href = 'login.html';
            } else if (data.status === 'success') {
               

                // Step 2: Validate the session using session_id and unique_id
                fetch('check-session.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: data.session_id,
                        unique_id: data.unique_id,
                    }),
                    credentials: 'same-origin', // Include cookies with the request
                })
                    .then(response => response.json())
                    .then(sessionData => {
                        if (sessionData.status === 'error') {
                            // If session is invalid, redirect to login
                            console.error(sessionData.message);
                            window.location.href = 'login.html';
                        } else if (sessionData.status === 'success') {
                            
                            // Allow access to the current page
                        }
                    })
                    .catch(error => {
                        console.error('Error validating session:', error);
                        window.location.href = 'login.html'; // Redirect if an error occurs
                    });
            }
        })
        .catch(error => {
            console.error('Error retrieving session details:', error);
            window.location.href = 'login.html'; // Redirect if an error occurs
        });
}

// Call validateSession when the page loads
document.addEventListener('DOMContentLoaded', validateSession);
    
    // Function to log out the user by calling the PHP logout script
    function logout() {
        // Send a GET request to the logout.php script to destroy the session
        fetch('logout.php', {
            method: 'GET',
            credentials: 'same-origin'  // Include cookies with the request
        })
        .then(response => response.json())  // Parse the JSON response
        .then(data => {
            if (data.status === 'success') {
                // Redirect to the login page after successful logout
                window.location.href = 'login.html';  // Change the URL to the login page
            } else {
                // Optionally, show an error message if logout fails
                console.log('Error logging out:', data.message);
            }
        })
        .catch(error => {
            console.error('Error during logout:', error);
        });
    }
    
    // Call checkSession when the page loads
    document.addEventListener('DOMContentLoaded', validateSession);
    
    // Attach the logout function to the logout button
    document.getElementById('logoutButton').addEventListener('click', function(e) {
        e.preventDefault();  // Prevent the default anchor behavior
        logout();  // Call the logout function
    });
    </script>
