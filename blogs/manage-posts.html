        /* Custom Theme Colors */

            --primary-color: #04335d;

        /* Sidebar */
        .sidebar {

            margin-bottom: 30px;
            margin-top: 20px;

        /* Sidebar Toggle Button */
        .sidebar-toggle {
            font-size: 1.5rem;
            color: var(--primary-color);
            /* Initial color is primary */
            cursor: pointer;
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;
        }

        .sidebar-toggle.active {
            color: white;
            /* Color when sidebar is active */
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {

            /* Hide sidebar initially */
            .sidebar {
                left: -250px;
                width: 0;
                transition: left 0.3s ease;
            }

            .sidebar.active {
                left: 0;
                width: 250px;
            }

            /* Adjust main content margin when sidebar is active */
            .main-content.active {
                margin-left: 0;
            }

            .main-content {
                margin-left: 0;
            }

            .main-content h1 {
                margin-top: 0;
                margin-left: 23px;
            }

            /* Prevent row from overlapping sidebar on mobile */
            .row {
                margin-left: 0;
                padding-left: 0;
            }

            /* Adjust cards to be full-width on mobile */
            .card {
                margin-bottom: 15px;
            }

            /* Sidebar Toggle Button Visibility */
            .sidebar-toggle {
                display: block;
                position: fixed;
                top: 15px;
                left: 15px;
                z-index: 1000;
            }
        }

        /* Hide Sidebar Toggle Button for desktop */
        @media (min-width: 769px) {
            .sidebar-toggle {
                display: none;
            }
        }

<!-- Modal for Delete Confirmation -->
<div class="modal fade" id="deleteConfirmationModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">

        <script>
           
function validateSession() {
    // Step 1: Retrieve session details
    fetch('check_session.php', {
        method: 'GET',
        credentials: 'same-origin', // Include cookies with the request
    })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'error') {
                // If no valid session is found, redirect to login
                console.error(data.message);
                window.location.href = 'login.html';
            } else if (data.status === 'success') {
               

                // Step 2: Validate the session using session_id and unique_id
                fetch('check-session.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: data.session_id,
                        unique_id: data.unique_id,
                    }),
                    credentials: 'same-origin', // Include cookies with the request
                })
                    .then(response => response.json())
                    .then(sessionData => {
                        if (sessionData.status === 'error') {
                            // If session is invalid, redirect to login
                            console.error(sessionData.message);
                            window.location.href = 'login.html';
                        } else if (sessionData.status === 'success') {
                            
                            // Allow access to the current page
                        }
                    })
                    .catch(error => {
                        console.error('Error validating session:', error);
                        window.location.href = 'login.html'; // Redirect if an error occurs
                    });
            }
        })
        .catch(error => {
            console.error('Error retrieving session details:', error);
            window.location.href = 'login.html'; // Redirect if an error occurs
        });
}

// Call validateSession when the page loads
document.addEventListener('DOMContentLoaded', validateSession);
            
            // Function to log out the user by calling the PHP logout script
            function logout() {
                // Send a GET request to the logout.php script to destroy the session
                fetch('logout.php', {
                    method: 'GET',
                    credentials: 'same-origin'  // Include cookies with the request
                })
                .then(response => response.json())  // Parse the JSON response
                .then(data => {
                    if (data.status === 'success') {
                        // Redirect to the login page after successful logout
                        window.location.href = 'login.html';  // Change the URL to the login page
                    } else {
                        // Optionally, show an error message if logout fails
                        console.log('Error logging out:', data.message);
                    }
                })
                .catch(error => {
                    console.error('Error during logout:', error);
                });
            }
        
            
            // Attach the logout function to the logout button
            document.getElementById('logoutButton').addEventListener('click', function(e) {
                e.preventDefault();  // Prevent the default anchor behavior
                logout();  // Call the logout function
            });
            </script>

        <script>


 // Toggle Sidebar
 document.querySelector('.sidebar-toggle').addEventListener('click', function () {
            var sidebar = document.querySelector('.sidebar');
            var mainContent = document.querySelector('.main-content');
            var toggleButton = document.querySelector('.sidebar-toggle');

            // Toggle the active class for sidebar and main content
            sidebar.classList.toggle('active');
            mainContent.classList.toggle('active');

            // Toggle the active class for the toggle button to change color
            toggleButton.classList.toggle('active');
        });

            // Fetch posts from the backend using POST
            function fetchPosts() {
                fetch('get_post.php', {
                    method: 'POST',  // Use POST request
                    headers: {
                        'Content-Type': 'application/json'  // Send as JSON
                    },
                    body: JSON.stringify({})  // Sending empty object since we're fetching all posts
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const postsTableBody = document.querySelector('#posts-table tbody');
                        postsTableBody.innerHTML = '';  // Clear the table before adding new rows
            
                        data.posts.forEach((post, index) => {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${index + 1}</td> <!-- Serial Number -->
                                <td>${post.id}</td>  <!-- Post ID -->
                                <td>${post.title}</td>  <!-- Post Title -->
                                <td>${post.date}</td>  <!-- Post Date -->
                                <td>
                                    <a href="edit-post.php?id=${post.id}" class="btn btn-warning btn-sm">
                                        <i class="fas fa-edit"></i> Edit
                                    </a>
                                    <button class="btn btn-danger btn-sm" onclick="confirmDelete(${post.id})">
                                        <i class="fas fa-trash-alt"></i> Delete
                                    </button>
                                </td>
                            `;
                            postsTableBody.appendChild(row);
                        });
                    } else {
                        alert('Error fetching posts');
                    }
                })
                .catch(error => console.error('Error fetching posts:', error));
            }
            let postIdToDelete = null; // Declare a variable to hold the post ID

// Function to show the confirmation modal
function confirmDelete(postId) {
    postIdToDelete = postId; // Store the post ID
    $('#deleteConfirmationModal').modal('show'); // Show the modal
}

// Function to delete a post
function deletePost() {
    if (postIdToDelete) {
        // Send DELETE request to the backend with JSON body
        fetch('delete_post.php', {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ id: postIdToDelete }), // Pass the post ID in the body
        })
        .then(response => response.json())
        .then(data => {
            $('#deleteConfirmationModal').modal('hide'); // Hide the modal after response
            if (data.status === 'success') {
                showAlert('success', 'Post, images, and HTML file deleted successfully');
                fetchPosts(); // Refresh the posts list
            } else {
                showAlert('error', data.message); // Show error message if any
            }
        })
        .catch(error => {
            console.error('Error:', error);
            $('#deleteConfirmationModal').modal('hide');
            showAlert('error', 'An error occurred while deleting the post');
        });
       // Function to show alert messages
function showAlert(type, message) {
    // Create the alert element
    const alertDiv = document.createElement('div');
    alertDiv.classList.add('alert', 'alert-dismissible', 'fade', 'show');

    // Add the correct class based on the alert type
    if (type === 'success') {
        alertDiv.classList.add('alert-success');
    } else if (type === 'error') {
        alertDiv.classList.add('alert-danger');
    }

    // Set the alert message
    alertDiv.innerHTML = `<strong>${message}</strong>
                          <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                          </button>`;

    // Apply custom width and other styles
    alertDiv.style.width = '50vw';  // Set the width to 80% of the viewport width
    alertDiv.style.margin = '10px auto';  // Center the alert horizontally and add some margin

    // Get the alert container element
    const alertContainer = document.getElementById('alertContainer');

    if (alertContainer) {
        // Append the alert to the container
        alertContainer.appendChild(alertDiv);

        // Automatically remove the alert after 5 seconds
        setTimeout(() => {
            alertDiv.remove();
        }, 5000);
    } else {
        console.error('Alert container not found!');
    }
}


    }
}

              // Fetch posts on page load
            window.onload = fetchPosts;
